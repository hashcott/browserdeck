name: release
# Push a tag like v0.1.0 to build the Windows installer and open a draft GitHub Release with it.
# Run it by hand (Actions > release > Run workflow) to build the installer only, as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # build scripts must not find a write token in .git/config
      - name: Tag matches the app version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$env:TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test -- --run
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis
      - name: Collect the installer and its checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Get-ChildItem out/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browserdeck-windows
          path: out/*
      - name: Draft the GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/* --draft --generate-notes --title "Browserdeck $TAG"
