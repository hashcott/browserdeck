[package]
name = "stream-deck"
version = "0.1.0"
edition = "2021"

[lib]
name = "stream_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
subtle = "2"

[dev-dependencies]
tempfile = "3"
